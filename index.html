<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Você é o amor da minha vida ❤</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- INTRO -->
<div id="intro" class="intro">
  <div class="wrapped">
    <h1>2025</h1>
    <p>Meu Spotify Wrapped foi você ❤</p>
    <button class="play-btn" onclick="entrar()">▶</button>
  </div>
</div>

<!-- APP -->
<div id="spotify" class="spotify hidden">

  <div class="player-card">
    <h3 class="amor-texto">Você é o amor da minha vida ❤</h3>

    <img src="foto.jpeg" class="cover">

    <div class="music-info">
      <small>Para o meu grande amor</small>
      <h2>About You</h2>
      <p>The 1975</p>
    </div>

    <!-- BARRA FAKE -->
    <div class="progress">
      <span id="current">0:00</span>
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>
      <span>5:26</span>
    </div>

    <iframe
      src="https://open.spotify.com/embed/track/1fDFHXcykq4iw8Gg7s5hG9"
      width="100%"
      height="80"
      frameborder="0"
      allow="autoplay; encrypted-media">
    </iframe>
  </div>

  <!-- TEMPO -->
  <div class="time-card">
    <p class="since">Juntos desde:</p>
    <div class="grid">
      <div><span id="anos"></span><small>Anos</small></div>
      <div><span id="meses"></span><small>Meses</small></div>
      <div><span id="dias"></span><small>Dias</small></div>
      <div><span id="horas"></span><small>Horas</small></div>
      <div><span id="minutos"></span><small>Minutos</small></div>
      <div><span id="segundos"></span><small>Segundos</small></div>
    </div>
  </div>

</div>

<!-- PLAY FLUTUANTE -->
<button class="floating-play">▶</button>

<script src="script.js"></script>
</body>
</html>
