<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Para o meu grande amor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TELA 1 -->
<div id="intro" class="intro">
  <button class="play-btn" onclick="entrar()">▶</button>
  <p>clique aqui</p>
</div>

<!-- TELA 2 -->
<div id="spotify" class="spotify hidden">

  <!-- PLAYER -->
  <div class="player-card">
    <img src="foto.jpeg" alt="Capa">
    <small>Para o meu grande amor</small>
    <h2>About You</h2>
    <p>The 1975</p>

    <!-- Spotify Embed -->
    <iframe 
      style="border-radius:12px" 
      src="https://open.spotify.com/embed/track/1fDFHXcykq4iw8Gg7s5hG9"
      width="100%" 
      height="80" 
      frameborder="0" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>

  <!-- CONTADOR -->
  <div class="time-card">
    <h3>Clara e Hélio</h3>
    <p>Juntos desde 08/11/2025 às 17:00</p>

    <div class="grid">
      <div><span id="anos"></span><small>Anos</small></div>
      <div><span id="meses"></span><small>Meses</small></div>
      <div><span id="dias"></span><small>Dias</small></div>
      <div><span id="horas"></span><small>Horas</small></div>
      <div><span id="minutos"></span><small>Minutos</small></div>
      <div><span id="segundos"></span><small>Segundos</small></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
