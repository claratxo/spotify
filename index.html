<script>
// Log inicial para confirmar que o script roda
console.log("Script carregado e executando!");

// Garante que a tela final esteja escondida ao carregar
document.addEventListener("DOMContentLoaded", () => {
  console.log("DOM carregado, verificando tela final...");
  const finalScreen = document.getElementById("final-screen");
  if (finalScreen) {
    finalScreen.classList.add("hidden");
    console.log("Tela final escondida com sucesso.");
  } else {
    console.error("Erro: Elemento 'final-screen' não encontrado.");
  }
});

function entrar() {
  console.log("Função entrar() foi chamada!"); // Deve aparecer no console ao clicar

  const intro = document.getElementById("intro");
  const spotify = document.getElementById("spotify");

  if (intro && spotify) {
    console.log("Escondendo intro e mostrando spotify...");
    intro.style.display = "none";
    spotify.classList.remove("hidden");
  } else {
    console.error("Erro: Elementos 'intro' ou 'spotify' não encontrados. Verifique os IDs no HTML.");
  }
}

/* CONTADOR */
const inicio = new Date("2025-11-08T17:00:00");

function atualizarTempo() {
  const agora = new Date();
  let diff = agora - inicio;

  if (diff < 0) {
    console.log("Data futura, mostrando 0 no contador.");
    document.getElementById("anos").innerText = 0;
    document.getElementById("meses").innerText = 0;
    document.getElementById("dias").innerText = 0;
    document.getElementById("horas").innerText = 0;
    document.getElementById("minutos").innerText = 0;
    document.getElementById("segundos").innerText = 0;
    return;
  }

  const anos = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
  const meses = Math.floor((diff % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24 * 30.44));
  const dias = Math.floor((diff % (1000 * 60 * 60 * 24 * 30.44)) / (1000 * 60 * 60 * 24));
  const horas = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutos = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const segundos = Math.floor((diff % (1000 * 60)) / 1000);

  document.getElementById("anos").innerText = anos;
  document.getElementById("meses").innerText = meses;
  document.getElementById("dias").innerText = dias;
  document.getElementById("horas").innerText = horas;
  document.getElementById("minutos").innerText = minutos;
  document.getElementById("segundos").innerText = segundos;
}

setInterval(atualizarTempo, 1000);
atualizarTempo();

/* BARRA FAKE */
let progress = 0;
const progressInterval = setInterval(() => {
  progress += 0.3;
  if (progress >= 100) {
    progress = 100;
    clearInterval(progressInterval);
  }
  const fill = document.getElementById("fill");
  if (fill) fill.style.width = progress + "%";
}, 1000);

/* LETRAS */
const lyrics = [
  "There was something about you",
  "I miss you, I'm sorry",
  "Do you think I have forgotten?",
  "Something about you"
];

let i = 0;
setInterval(() => {
  const el = document.getElementById("lyric");
  if (el) {
    el.style.opacity = 0;
    setTimeout(() => {
      el.innerText = lyrics[i];
      el.style.opacity = 1;
      i = (i + 1) % lyrics.length;
    }, 1000);
  }
}, 5000);

/* FINAL */
function mostrarFinal() {
  console.log("Função mostrarFinal() chamada!");
  const finalScreen = document.getElementById("final-screen");
  if (finalScreen) {
    finalScreen.classList.remove("hidden");
  } else {
    console.error("Erro: Elemento 'final-screen' não encontrado.");
  }
}

/* REPLAY (botão flutuante) */
function replay() {
  console.log("Reiniciando página...");
  location.reload();
}
</script>
