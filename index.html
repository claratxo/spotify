<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Você é o amor da minha vida ❤</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- INTRO -->
<div id="intro" class="intro">
  <button id="start-btn" class="play-btn" type="button">Clique aqui</button>
</div>

<!-- APP -->
<div id="spotify" class="spotify hidden">

  <div class="player-card">
    <h3 class="amor-texto">Você é o amor da minha vida ❤</h3>

    <img src="foto.jpeg" alt="Capa" class="cover">

    <div class="music-info">
      <small>Para o meu grande amor</small>
      <h2>About You</h2>
      <p>The 1975</p>
    </div>

    <p id="lyric" class="lyric"></p>

    <div class="progress">
      <span>0:00</span>
      <div class="bar">
        <div id="fill" class="fill"></div>
      </div>
      <span>5:26</span>
    </div>

    <iframe
      src="https://open.spotify.com/embed/track/1fDFHXcykq4iw8Gg7s5hG9"
      width="100%"
      height="80"
      frameborder="0"
      allow="autoplay; encrypted-media">
    </iframe>
  </div>

  <div class="time-card">
    <p class="since">Juntos desde:</p>
    <div class="grid">
      <div><span id="anos">0</span><small>Anos</small></div>
      <div><span id="meses">0</span><small>Meses</small></div>
      <div><span id="dias">0</span><small>Dias</small></div>
      <div><span id="horas">0</span><small>Horas</small></div>
      <div><span id="minutos">0</span><small>Minutos</small></div>
      <div><span id="segundos">0</span><small>Segundos</small></div>
    </div>
  </div>

  <div class="final">
    <button id="final-btn" type="button">Ver o que vem depois ▶</button>
  </div>

</div>

<!-- TELA FINAL (COMEÇA ESCONDIDA!) -->
<div id="final-screen" class="final-screen hidden">
  <p>Se eu tivesse que escolher de novo,<br>ainda seria você.</p>
</div>

<script src="script.js"></script>
</body>
</html>
